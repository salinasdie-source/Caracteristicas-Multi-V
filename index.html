<script>
var FILL=document.getElementById('fill'), MSG=document.getElementById('msg');
function progress(p,m){FILL.style.width=p+'%';if(m)MSG.textContent=m;}
function loadScript(url,cb){
  var s=document.createElement('script');
  s.src=url;s.onload=cb;
  s.onerror=function(){MSG.textContent='Error: '+url.split('/').pop();FILL.style.background='#ef4444';};
  document.head.appendChild(s);
}

progress(5,'Cargando estilos...');
loadScript('https://cdn.tailwindcss.com',function(){
  progress(20,'Cargando React...');
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',function(){
    progress(40,'Cargando ReactDOM...');
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',function(){
      progress(60,'Cargando compilador...');
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js',function(){
        progress(75,'Compilando...');
        setTimeout(go, 30);
      });
    });
  });
});

function go(){
  try {
    progress(76, 'Leyendo codigo...');
    var src = document.getElementById('app').textContent;
    progress(80, 'Compilando JSX ('+Math.round(src.length/1024)+'KB)...');
    setTimeout(function(){
      var compiled;
      try {
        compiled = Babel.transform(src, {presets:['react']}).code;
      } catch(e){ MSG.textContent='Error JSX: '+e.message; FILL.style.background='#ef4444'; return; }
      progress(93,'Ejecutando...');
      setTimeout(function(){
        try {
          var fn = new Function(
            'React','ReactDOM','useState','useMemo','useRef','useEffect',
            'Search','Send','Snowflake','Wind','Layers','Loader2',
            'ChevronRight','ChevronLeft','Database','AlertCircle','Info',
            compiled+'\nreturn App;'
          );
          var ic = window.__ICONS__;
          var App = fn(
            React,ReactDOM,
            React.useState,React.useMemo,React.useRef,React.useEffect,
            ic.Search,ic.Send,ic.Snowflake,ic.Wind,ic.Layers,ic.Loader2,
            ic.ChevronRight,ic.ChevronLeft,ic.Database,ic.AlertCircle,ic.Info
          );
          progress(100,'Listo!');
          document.getElementById('splash').style.display='none';
          try {
            ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
          } catch(e2) {
            document.getElementById('splash').style.display='flex';
            MSG.textContent='Error render: '+e2.message;
            FILL.style.background='#ef4444';
          }
        } catch(e){ MSG.textContent='Error runtime: '+e.message; FILL.style.background='#ef4444'; console.error(e); }
      }, 50);
    }, 100);
  } catch(e){ MSG.textContent='Error general: '+e.message; FILL.style.background='#ef4444'; console.error(e); }
}
if('serviceWorker' in navigator)
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
</script>

<script id="app" type="text/plain">

// ===================== DATOS (195 modelos, embebidos directamente) =====================
const CATALOG = window.__CATALOG__;

// Productos de control LG BECON: 15 grupos con características extraídas del manual (PDF reparado).
// Tablas multi-modelo: los valores en columnas aparecen en secuencia separada por espacios.
const BECON_DATA = window.__BECON__;

// ===================== UTILIDADES =====================

function flattenSpecValue(v) {
  if (Array.isArray(v)) {
    return v.map((x) => `${x.value}${x.unit ? " " + x.unit : ""}`).join(" / ");
  }
  if (v && typeof v === "object") {
    return `${v.value}${v.unit ? " " + v.unit : ""}`;
  }
  return String(v);
}

const TIPO_LABEL = {
  idu: "Unidad interior",
  odu_indep: "Unidad exterior (Multi V 5 Pro)",
  odu_comb: "Unidad exterior combinada (Multi V 5 Pro)",
  odu_mvs: "Unidad exterior (Multi V S — 220V monofásico)",
  odu_mvs_lss0: "Unidad exterior (Multi V S — 380V trifásico)",
};

const TIPO_ICON = {
  idu: Wind,
  odu_indep: Snowflake,
  odu_comb: Layers,
  odu_mvs: Snowflake,
  odu_mvs_lss0: Snowflake,
};

function buildAllUnits() {
  const idu = Object.values(CATALOG.unidades_interiores).map((u) => ({ ...u, tipo: "idu" }));
  const oduIndep = Object.values(CATALOG.unidades_exteriores_independientes).map((u) => ({ ...u, tipo: "odu_indep" }));
  const oduComb = Object.values(CATALOG.unidades_exteriores_combinadas).map((u) => ({ ...u, tipo: "odu_comb" }));
  const oduMvs = Object.values(CATALOG.unidades_exteriores_mvs).map((u) => ({ ...u, tipo: "odu_mvs" }));
  const oduMvsLss0 = Object.values(CATALOG.unidades_exteriores_mvs_lss0).map((u) => ({ ...u, tipo: "odu_mvs_lss0" }));
  return [...idu, ...oduIndep, ...oduComb, ...oduMvs, ...oduMvsLss0];
}

const ALL_UNITS = buildAllUnits();

const INDEX = {
  idu: Object.keys(CATALOG.unidades_interiores),
  odu_indep: Object.keys(CATALOG.unidades_exteriores_independientes),
  odu_comb: Object.keys(CATALOG.unidades_exteriores_combinadas),
  odu_mvs: Object.keys(CATALOG.unidades_exteriores_mvs),
  odu_mvs_lss0: Object.keys(CATALOG.unidades_exteriores_mvs_lss0),
};

// ===================== COMPONENTE: Ficha tecnica =====================

function SpecRow({ label, value }) {
  return (
    <div className="flex items-start justify-between gap-4 py-2 border-b border-slate-800/60 last:border-0">
      <span className="text-[13px] text-slate-400 leading-snug">{label}</span>
      <span className="text-[13px] text-slate-100 font-medium text-right leading-snug font-mono">
        {value}
      </span>
    </div>
  );
}

function UnitCard({ unit }) {
  if (!unit) return null;
  const entries = Object.entries(unit.especificaciones || {});
  const Icon = TIPO_ICON[unit.tipo];
  return (
    <div className="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
      <div className="bg-gradient-to-r from-red-900/40 to-slate-900 px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div>
          <div className="flex items-center gap-2">
            <Icon size={16} className={unit.tipo === "idu" ? "text-sky-400" : "text-red-400"} />
            <h3 className="font-mono text-base font-semibold text-white tracking-tight">
              {unit.modelo}
            </h3>
          </div>
          {unit.tipologia && (
            <p className="text-[12px] text-sky-300/80 font-medium mt-0.5">{unit.tipologia}</p>

          )}

          <p className="text-slate-500 text-sm py-4 text-center">Sin especificaciones cargadas</p>

          <SpecRow key={label} label={label} value={flattenSpecValue(value)} />
        ))}
      </div>

}

// ===================== COMPONENTE: Buscador simple =====================

function SimpleSearch() {
  const [query, setQuery] = useState("");
  const [filterTipo, setFilterTipo] = useState("todos");
  const [selected, setSelected] = useState(null);

  const filtered = useMemo(() => {
    const q = query.trim().toUpperCase();
    return ALL_UNITS.filter((u) => {
      if (filterTipo !== "todos" && u.tipo !== filterTipo) return false;
      if (q && !u.modelo.toUpperCase().includes(q)) return false;
      return true;
    });
  }, [query, filterTipo]);

  useEffect(() => {
    // No se auto-selecciona nada al cargar: la app arranca mostrando el listado completo.
    // Si el modelo seleccionado deja de estar entre los resultados filtrados (por una
    // busqueda o cambio de filtro), se limpia la seleccion en vez de saltar a otro modelo.
    if (selected && !filtered.find((f) => f.modelo + "|" + f.tipo === selected)) {
      setSelected(null);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [filtered]);

  function selectUnit(key) {
    setSelected(key);
  }

  function clearSelection() {
    setSelected(null);
  }

  const activeUnit = selected ? ALL_UNITS.find((u) => u.modelo + "|" + u.tipo === selected) : null;

  return (
    <div className="grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-4">
      <div
        className={
          "bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex flex-col h-[600px] " +
          (activeUnit ? "hidden lg:flex" : "flex")
        }
      >
        <div className="p-3 border-b border-slate-800 space-y-2">
          <div className="relative">
            <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Buscar modelo..."
              className="w-full bg-slate-800 text-slate-100 placeholder-slate-500 text-[13px] rounded-md pl-9 pr-3 py-2.5 outline-none focus:ring-2 focus:ring-red-700/60"
            />
          </div>
          <div className="flex flex-wrap gap-1">
            {[
              ["todos", "Todos"],
              ["idu", "Interiores"],

// ===================== COMPONENTE: Chat lenguaje natural =====================

function ChatPanel() {
  const [messages, setMessages] = useState([
    {
      role: "assistant",
      content:
        "Pregúntame sobre cualquiera de los modelos cargados. Por ejemplo: \"¿Cuál es el EER de la ARUN281BLS5?\" o \"Compara el peso de la ARNU07GTUB4 y la ARNU24GTTB4\".",
    },
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages, loading]);

  function extractMentionedModels(text) {
    const upper = text.toUpperCase();

    // 1. Coincidencia exacta de codigo de modelo completo
    const exact = ALL_UNITS.filter((u) => upper.includes(u.modelo.toUpperCase()));
    if (exact.length > 0) return { matches: exact, partial: false, fragment: null };

    // 2. Coincidencia parcial: fragmentos alfanumericos de 3+ chars que aparecen en codigos
    const tokens = (upper.match(/[A-Z0-9]{3,}/g) || []);
    const sortedTokens = [...new Set(tokens)].sort((a, b) => b.length - a.length);
    for (const token of sortedTokens) {
      const partialMatches = ALL_UNITS.filter((u) => u.modelo.toUpperCase().includes(token));
      if (partialMatches.length > 0 && partialMatches.length < ALL_UNITS.length) {
        return { matches: partialMatches, partial: true, fragment: token };
      }
    }

    // 3. Inferencia semantica: si no hay codigo, usar palabras clave de la pregunta
    // para seleccionar el subconjunto de modelos mas relevante como contexto
    const esExterior = /exterior|outdoor|odu|unidad.{0,10}extern|equipo.{0,10}extern/i.test(text);
    const esInterior = /interior|indoor|idu|unidad.{0,10}intern|cassette|ducto|consola|pared/i.test(text);
    const esCombinada = /combinad|sistema|conjunto/i.test(text);
    const esMvs = /multi.?v.?s|mvs|gss|lss/i.test(text);

    let semanticMatches = [];
    if (esMvs) {
      semanticMatches = ALL_UNITS.filter((u) => u.tipo === "odu_mvs" || u.tipo === "odu_mvs_lss0");
    } else if (esExterior && !esInterior) {
      semanticMatches = esCombinada
        ? ALL_UNITS.filter((u) => u.tipo === "odu_comb")
        : ALL_UNITS.filter((u) => u.tipo === "odu_indep" || u.tipo === "odu_mvs" || u.tipo === "odu_mvs_lss0");
    } else if (esInterior && !esExterior) {
      semanticMatches = ALL_UNITS.filter((u) => u.tipo === "idu");
    } else if (esExterior && esInterior) {
      semanticMatches = ALL_UNITS.filter((u) => u.tipo !== "idu");
    }

    if (semanticMatches.length > 0) {
      return { matches: semanticMatches, partial: false, fragment: null, semantic: true };
    }

    return { matches: [], partial: false, fragment: null };
  }

  async function handleSend() {
    const question = input.trim();
    if (!question || loading) return;
    setInput("");
    setError(null);
    const newMessages = [...messages, { role: "user", content: question }];
    setMessages(newMessages);
    setLoading(true);

    try {
      const { matches, partial, fragment, semantic } = extractMentionedModels(question);

      // Limitar contexto semantico para no sobrecargar la API
      const MAX_SEMANTIC_MODELS = 20;
      let effectiveMatches = matches;
      let truncated = false;
      if (semantic && matches.length > MAX_SEMANTIC_MODELS) {
        effectiveMatches = matches.slice(0, MAX_SEMANTIC_MODELS);
        truncated = true;
      }

      let contextData = {};
      for (const m of effectiveMatches) {
        contextData[m.modelo] = m;
      }

      const partialNote = partial
        ? `\nNOTA: "${fragment}" es un fragmento/familia, no un modelo exacto. Se encontraron ${matches.length} modelo(s) con ese fragmento. Lista las coincidencias y muestra el dato pedido para cada una en tabla. Si el valor es igual en todos, dilo una vez aclarando que aplica a toda la familia.`
        : semantic
        ? `\nNOTA: el usuario no menciono un modelo especifico. Se proveen los modelos de esa categoria como contexto${truncated ? ` (primeros ${MAX_SEMANTIC_MODELS} de ${matches.length} por limite de contexto)` : ""}. Usa una tabla comparativa para el dato pedido. Si el dato es igual en todos los modelos, dilo claramente una sola vez.`
        : "";

      const systemPrompt = `Eres un asistente tecnico especializado en equipos HVAC de LG (sistemas Multi V VRF).
Respondes preguntas SOLO usando los datos provistos a continuacion, extraidos de data books oficiales de LG.

Reglas:
- Responde en español, de forma breve, precisa y tecnica.
- Si el dato exacto no esta en los datos provistos, dilo claramente: no inventes valores.
- Cuando cites un valor, indica el modelo al que corresponde.
- Si la pregunta requiere comparar varios modelos, usa una tabla markdown breve.
- Catalogo disponible: ${INDEX.idu.length} interiores, ${INDEX.odu_indep.length} exteriores simples, ${INDEX.odu_comb.length} exteriores combinadas.${partialNote}

LISTA DE MODELOS DISPONIBLES:
Interiores: ${INDEX.idu.join(", ")}
Exteriores simples: ${INDEX.odu_indep.join(", ")}
Exteriores combinadas: ${INDEX.odu_comb.join(", ")}

DATOS DE LOS MODELOS MENCIONADOS EN LA PREGUNTA ACTUAL:
${JSON.stringify(contextData)}`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1200,
          system: systemPrompt,
          messages: newMessages.map((m) => ({ role: m.role, content: m.content })),
        }),
      });

      if (!response.ok) {
        throw new Error("Error de red al consultar la API (" + response.status + ")");
      }

      const data = await response.json();
      const textBlock = (data.content || []).find((c) => c.type === "text");
      const answer = textBlock ? textBlock.text : "No obtuve una respuesta legible.";
      setMessages((prev) => [...prev, { role: "assistant", content: answer }]);
    } catch (err) {
      setError(err.message || "Error desconocido");
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  }

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-lg flex flex-col h-[600px]">
      <div className="px-5 py-3 border-b border-slate-800 flex items-center gap-2">
        <Database size={15} className="text-red-400" />
        <h2 className="text-sm font-semibold text-slate-200">Pregunta en lenguaje natural</h2>
      </div>
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-5 py-4 space-y-4">
        {messages.map((m, i) => (
          <div key={i} className={m.role === "user" ? "flex justify-end" : "flex justify-start"}>
            <div
              className={
                "max-w-[85%] rounded-lg px-4 py-2.5 text-[13px] leading-relaxed whitespace-pre-wrap " +
                (m.role === "user" ? "bg-red-700 text-white" : "bg-slate-800 text-slate-200")
              }
            >
              {m.content}
            </div>
          </div>
        ))}
        {loading && (
          <div className="flex justify-start">
            <div className="bg-slate-800 text-slate-400 rounded-lg px-4 py-2.5 text-[13px] flex items-center gap-2">
              <Loader2 size={14} className="animate-spin" />
              Consultando catálogo...
            </div>
          </div>
        )}
        {error && (
          <div className="flex justify-start">
            <div className="bg-red-950/60 border border-red-800 text-red-300 rounded-lg px-4 py-2.5 text-[13px] flex items-start gap-2">
              <AlertCircle size={14} className="mt-0.5 shrink-0" />
              {error}
            </div>
          </div>
        )}
      </div>
      <div className="border-t border-slate-800 p-3 flex items-end gap-2">
        <textarea
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="Ej: ¿Qué EER tiene la ARUN281BLS5?"
          rows={1}
          className="flex-1 resize-none bg-slate-800 text-slate-100 placeholder-slate-500 text-[13px] rounded-md px-3 py-2.5 outline-none focus:ring-2 focus:ring-red-700/60 max-h-24"
        />
        <button
          onClick={handleSend}
          disabled={loading || !input.trim()}
          className="bg-red-700 hover:bg-red-600 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-md p-2.5 transition-colors shrink-0"
          aria-label="Enviar pregunta"
        >
          <Send size={16} />
        </button>
      </div>
    </div>
  );
}

// ===================== COMPONENTE: Fichas de control LG BECON =====================

function BeconReference() {
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(null);

  const entries = useMemo(() => Object.values(BECON_DATA), []);

  const filtered = useMemo(() => {
    const q = query.trim().toUpperCase();
    if (!q) return entries;
    return entries.filter((e) => e.modelo_grupo.toUpperCase().includes(q));
  }, [query, entries]);

  const activeEntry = selected ? BECON_DATA[selected] : null;

  return (
    <div className="grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-4">
      {/* Lista */}
      <div className={"bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex flex-col h-[600px] " + (activeEntry ? "hidden lg:flex" : "flex")}>
        <div className="p-3 border-b border-slate-800">
          <div className="relative">
            <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Buscar modelo de control..."
              className="w-full bg-slate-800 text-slate-100 placeholder-slate-500 text-[13px] rounded-md pl-9 pr-3 py-2.5 outline-none focus:ring-2 focus:ring-red-700/60"
            />
          </div>
        </div>
        <div className="flex-1 overflow-y-auto">
          {filtered.length === 0 && (
            <p className="text-slate-500 text-[13px] px-4 py-6 text-center">Sin resultados</p>
          )}
          {filtered.map((e) => (
            <button
              key={e.modelo_grupo}
              onClick={() => setSelected(e.modelo_grupo)}
              className={"w-full flex items-center justify-between gap-2 px-4 py-3 text-left border-b border-slate-800/60 transition-colors " + (selected === e.modelo_grupo ? "bg-slate-800" : "hover:bg-slate-800/50")}
            >
              <div className="flex items-center gap-2 min-w-0">
                <Database size={13} className="text-amber-500 shrink-0" />
                <div className="min-w-0">
                  <span className="font-mono text-[12px] text-slate-200 truncate block">{e.modelo_grupo}</span>
                  {e.tipologia && (
                    <span className="text-[11px] text-slate-500 truncate block">{e.tipologia}</span>
                  )}
                </div>
              </div>
              <ChevronRight size={14} className="text-slate-600 shrink-0" />
            </button>
          ))}
        </div>
        <div className="px-4 py-2 border-t border-slate-800 text-[11px] text-slate-500">
          {filtered.length} de {entries.length} grupos · {Object.keys(BECON_DATA).length} productos de control
        </div>
      </div>

      {/* Ficha de detalle */}
      <div className={"h-[600px] overflow-hidden " + (activeEntry ? "block" : "hidden lg:block")}>
        {activeEntry ? (
          <div className="h-full flex flex-col gap-2">
            <button
              onClick={() => setSelected(null)}
              className="lg:hidden flex items-center gap-1.5 text-[13px] text-slate-400 hover:text-slate-200 px-1 shrink-0"
            >
              <ChevronLeft size={15} /> Volver al listado
            </button>
            <div className="flex-1 overflow-hidden bg-slate-900 border border-slate-800 rounded-lg">
              <div className="bg-gradient-to-r from-amber-900/30 to-slate-900 px-5 py-4 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <Database size={15} className="text-amber-500" />
                  <h3 className="font-mono text-[13px] font-semibold text-white">{activeEntry.modelo_grupo}</h3>
                </div>
                {activeEntry.tipologia && (
                  <p className="text-[12px] text-amber-300/80 font-medium mt-0.5">{activeEntry.tipologia}</p>
                )}
                <p className="text-xs text-slate-500 mt-0.5">Control LG BECON · pág. {activeEntry.pagina_pdf} del manual</p>
                {activeEntry.uso_tipico && (
                  <p className="text-[12px] text-slate-300 mt-2 leading-relaxed">{activeEntry.uso_tipico}</p>
                )}
                <div className="mt-2 flex items-start gap-1.5">
                  <Info size={12} className="text-amber-600/80 shrink-0 mt-0.5" />
                  <p className="text-[11px] text-amber-600/80 leading-relaxed">
                    {Object.keys(activeEntry.caracteristicas).length > 0
                      ? "Datos extraídos automáticamente del PDF. Verificar contra el manual original."
                      : "Sin características extraíbles para este modelo."}
                  </p>
                </div>
              </div>
              <div className="px-5 py-2 max-h-[460px] overflow-y-auto">
                {Object.entries(activeEntry.caracteristicas).map(([feat, val]) => (
                  <div key={feat} className="flex items-start justify-between gap-4 py-2 border-b border-slate-800/60 last:border-0">
                    <span className="text-[12px] text-slate-400 leading-snug shrink-0 max-w-[45%]">{feat}</span>
                    <span className="text-[12px] text-slate-100 font-medium text-right leading-snug font-mono">{val || "—"}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        ) : (
          <div className="h-full flex flex-col items-center justify-center text-slate-500 text-sm gap-2">
            <Database size={24} className="text-slate-700" />
            <p>Seleccioná un producto de control</p>
          </div>
        )}
      </div>
    </div>
  );
}
